<style>
    .sidebar {
        position: absolute;
        display: block;
        width: 15rem;
        background-color: rgb(184, 182, 182);
        height: 100%;
    }

    @media print {
        .sidebar {
            visibility: hidden;
        }
    }

    .content {
        position: absolute;
        left: 18rem;
        top: 5%;
        y: 0;
        width: 60%;
        height: 90%;
        display: grid;
        border: 3px double gray;
        resize: both;
        overflow: auto;
    }

    .rangebox {
        background: linear-gradient(red, orange);
    }

    .gridline {
        border-top: 2px solid gray;
        grid-column: 1 / 5;
    }
</style>

<div class="sidebar">
    <form action="/submit" method="POST">
        <label for="attacker">Opponent char (attacker)</label>
        <select name="attacker" onchange="this.form.submit()">
            <option value="fox">Fox</option>
        </select>
        <label for="defender">Your char (defender)</label>
        <select name="defender" onchange="this.form.submit()">
            <option value="marth">Marth</option>
            <option value="fox">Fox</option>
            <option value="falco">Falco</option>
        </select>
    </form>
    <label for="max-percent">Max %:</label>
    <input type="range" value="100" min="10" max="200" step="10" id="max-percent"
        oninput="maxPercentValue.innerText = this.value">
    <output id="maxPercentValue">100</output>

    <details name="expand1">
        <summary>Ground moves</summary>
        <form>
            <fieldset>
                <legend>top of the thingy</legend>
                <input type="checkbox" id="ch1">
                <label for="ch1">check1</label>
                <input type="checkbox" id="ch2">
                <label for="ch2">check2</label>

            </fieldset>
        </form>
    </details>
    <details name="expand2">
        <summary>Aerials</summary>
        <form>
            <fieldset>
                <legend>top of the thingy</legend>
                <input type="checkbox" id="ch2.1">
                <label for="ch2.1">check1</label>
                <input type="checkbox" id="ch2.2">
                <label for="ch2.2">check2</label>

            </fieldset>
        </form>
    </details>
    <details name="expand3">
        <summary>Specials</summary>
        <form>
            <fieldset>
                <legend>top of the thingy</legend>
                <input type="checkbox" id="ch3.1">
                <label for="ch3.1">check1</label>
                <input type="checkbox" id="ch3.2">
                <label for="ch3.2">check2</label>
            </fieldset>
        </form>
    </details>
</div>
<!-- /sidebar -->

<div class="content">
    <div class="gridline" style="grid-row: 1 / 11;">0%</div>
    <div class="gridline" style="grid-row: 11 / 21;">10%</div>
    <div class="gridline" style="grid-row: 21 / 31;">20%</div>
    <div class="gridline" style="grid-row: 31 / 41;">30%</div>
    <div class="gridline" style="grid-row: 41 / 51;">40%</div>
    <div class="gridline" style="grid-row: 51 / 61;">50%</div>
    <div class="gridline" style="grid-row: 61 / 71;">60%</div>
    <div class="gridline" style="grid-row: 71 / 81;">70%</div>
    <div class="gridline" style="grid-row: 81 / 91;">80%</div>
    <div class="gridline" style="grid-row: 91 / 101;">90%</div>

    <div class="rangebox" style="grid-row: 40 / 55; grid-column: 2;">
        40-55
    </div>
</div>
